<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Camper Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <section id="screen-title" class="screen active">
      <div class="title-content">
        <h1>Camper Quest</h1>
        <img src="camper.png" alt="Claymation Camper" class="title-camper">
        <button id="btn-start" class="btn primary">Start Road Trip</button>
      </div>
    </section>

    <section id="screen-family" class="screen">
      <h2>Build Your Family</h2>
      <div class="card family-card">
        <label>You are the:
          <select id="player-role">
            <option value="Older Sister">Older Sister</option>
            <option value="Older Brother">Older Brother</option>
            <option value="Mom">Mom</option>
            <option value="Dad">Dad</option>
            <option value="Younger Sibling">Younger Sibling</option>
          </select>
        </label>
        <label>Your personality:
          <select id="player-personality">
            <option value="sarcastic">Sarcastic</option>
            <option value="peacemaker">Peacemaker</option>
            <option value="troublemaker">Troublemaker</option>
            <option value="anxious">Anxious</option>
            <option value="optimistic">Optimistic</option>
            <option value="grumpy">Grumpy</option>
            <option value="quiet">Quiet</option>
            <option value="loud">Loud</option>
          </select>
        </label>
        <label>Hair:
          <select id="player-hair">
            <option value="brown">Brown</option>
            <option value="blond">Blond</option>
            <option value="black">Black</option>
            <option value="red">Red / Auburn</option>
          </select>
        </label>
        <label>Skin:
          <select id="player-skin">
            <option value="light">Light</option>
            <option value="medium">Medium</option>
            <option value="tan">Tan</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label>Height:
          <select id="player-height">
            <option value="average">Average</option>
            <option value="tall">Tall</option>
            <option value="short">Short</option>
          </select>
        </label>
        <label>Weight:
          <select id="player-weight">
            <option value="average">Average</option>
            <option value="slim">Slim</option>
            <option value="stocky">Stocky</option>
          </select>
        </label>
        <label>Family size:
          <select id="family-size">
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </label>
        <div id="family-members-setup"></div>
        <p class="hint">Same personality options for everyone. Appearance is saved for your character.</p>
      </div>
      <div class="family-footer">
        <button id="btn-family-done" class="btn primary">Hit the Road</button>
      </div>
    </section>

    <section id="screen-hub" class="screen">
      <div class="day-banner">Day <span id="day-num">1</span> • <span id="day-label">Leaving Home</span></div>
      <h2>The Camper</h2>
      <div id="resources" class="resources">
        <div class="res"><span>⛽</span><b id="res-gas">80</b></div>
        <div class="res"><span>🍎</span><b id="res-food">55</b></div>
        <div class="res"><span>💵</span><b id="res-money">110</b></div>
        <div class="res"><span>😊</span><b id="res-morale">70</b></div>
        <div class="res"><span>🚨</span><b id="res-heat">0</b></div>
      </div>
      <div id="family-line" class="family-line"></div>
      <div class="hub-buttons">
        <button id="btn-rest" class="btn">Rest</button>
        <button id="btn-eat" class="btn">Eat</button>
        <button id="btn-talk-family" class="btn">Talk to Family</button>
        <button id="btn-weapons" class="btn">Check Gear</button>
        <button id="btn-depart" class="btn primary">Look at Map</button>
      </div>
      <div id="hub-log" class="log"></div>
    </section>

    <section id="screen-map" class="screen">
      <div class="day-banner">Day <span id="map-day">1</span></div>
      <h2>Where to next?</h2>
      <div class="destinations">
        <button class="btn dest" data-dest="reststop">Rusty's Roadside Rest Stop</button>
        <button class="btn dest" data-dest="campground">Shady Pines Campground</button>
        <button class="btn dest" data-dest="diner">Neon Diner & Gift Shop</button>
      </div>
      <button id="btn-map-back" class="btn secondary">Back to Camper</button>
    </section>

    <section id="screen-scene" class="screen">
      <div id="scene-stage">
        <div id="scene-bg"></div>
        <div id="hotspots"></div>
        <div id="scene-ui">
          <div id="scene-title"></div>
          <div class="scene-right">
            <button id="btn-inventory" class="icon-btn">🎒</button>
            <button id="btn-leave" class="icon-btn">🚐</button>
          </div>
        </div>
      </div>
    </section>

    <div id="dialogue" class="overlay hidden">
      <div class="dialogue-panel">
        <div id="dlg-speaker"></div>
        <div id="dlg-text"></div>
        <div id="dlg-choices"></div>
      </div>
    </div>

    <div id="inventory" class="overlay hidden">
      <div class="inv-panel">
        <h3>Gear & Inventory</h3>
        <div id="inv-list"></div>
        <button id="btn-close-inv" class="btn secondary">Close</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
